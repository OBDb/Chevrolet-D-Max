generations:
  - name: "First Generation"
    start_year: 2002
    end_year: 2012
    description: "The first-generation Chevrolet D-Max (in markets where Chevrolet badged this model) was essentially a rebadged Isuzu D-Max, a mid-size pickup truck developed by Isuzu but sold under various brands through GM's partnership with the Japanese manufacturer. Available in single cab, extended cab, and crew cab configurations, it was designed primarily for global markets outside North America. Powertrain options typically included 2.5L to 3.0L diesel engines and occasionally gasoline options depending on the market, paired with manual or automatic transmissions. The interior was functional and durable rather than luxurious, reflecting its positioning as a work-oriented vehicle in many markets. Production ended in 2012 in most markets, though continued until 2003 in China."

  - name: "First Generation (2006 Facelift)"
    start_year: 2006
    end_year: 2012
    description: "In 2006, the first-generation D-Max received a major facelift with the introduction of updated styling and a new 3.0L 4JJ1-TCX turbodiesel engine incorporating Variable Valve Geometry Turbo (VGS) technology. New transmissions were also introduced: MUX 5-Speed manual and MaxMatic-III automatic transmission. Models equipped with Xenon headlamps were changed to projector headlamps. The facelift introduced the new 'Hexapod-plot' interior design. Continued regional facelifts were introduced in 2007 (Malaysia) and 2009 with the most visible updates in July 2011."

  - name: "Second Generation"
    start_year: 2011
    end_year: 2015
    description: "The second-generation D-Max launched in September 2011 and featured more modern styling and improved refinement while maintaining its robust, work-oriented character. Still based on Isuzu engineering but sold as a Chevrolet in select markets, it continued to offer single cab, extended cab, and crew cab body styles. Diesel engines remained the primary powertrain option, initially offered in three configurations: two 2.5L units (115 and 136 hp) and a 3.0L unit (177 hp), with improved power, efficiency, and emissions control. The new i-GRIP (Isuzu Gravity Responsive Intelligent Platform) chassis was 42% stronger than its predecessor. The interior saw notable improvements in design and material quality, with more comfort and technology features, particularly in higher trim levels. Safety equipment was enhanced throughout the production run, with features like stability control, hill descent control, and multiple airbags becoming available."

  - name: "Second Generation (2015 Facelift)"
    start_year: 2015
    end_year: 2019
    description: "The second-generation D-Max received a 2015 facelift with visual updates. A 2017 facelift followed with further styling enhancements. In Malaysia, a notable facelift was introduced in October 2016, and another update occurred in February 2018 with navigation, leather seats, and sliding cargo tray features. Minor updates continued throughout this period. The second generation maintained the model's reputation for durability while adding refinement and features expected by evolving customer preferences, leading up to the third-generation launch in 2019."

  - name: "Third Generation"
    start_year: 2019
    end_year: 2023
    description: "The third-generation D-Max debuted in Thailand on 11 October 2019 and represents a significant advancement in design, technology, and capability. It features a more assertive exterior design with a larger grille, muscular fenders, and modern lighting elements. Built on the new Isuzu Dynamic Drive Platform (also called Symmetric Mobility Platform), which is 23% stiffer than the previous platform, with an expanded cross section of the ladder frame and optimized crossmember locations. Powertrains featured refined 1.9L (RZ4E-TC) and 3.0L (4JJ3-TCX) turbodiesel engines with improved power delivery and efficiency. The interior was thoroughly modernized with a more car-like design, improved materials, and enhanced technology including larger touchscreens with smartphone integration and advanced driver assistance systems. The third generation does not share platforms with Chevrolet Colorado, marking a significant departure from previous generations."

  - name: "Third Generation (2023 Facelift)"
    start_year: 2023
    end_year: null
    description: "The third-generation D-Max received a facelift debuting on 6 October 2023 in Thailand, with a new front fascia design, new LED headlights, a new tailgate, updated graphics for taillights and interior refinements. This facelift was subsequently introduced in various markets including Australia (April 2024), Malaysia (May 2024), Philippines (June 2024), and Vietnam (October 2024). The facelifted model maintains the same body configurations and engine options from the pre-facelift model, with a 2.2L DDi MaxForce diesel engine introduced in November 2024 in selected markets. The facelift demonstrates Isuzu's continued commitment to modernizing the D-Max while balancing work utility with passenger comfort and contemporary technology."
